project:
  name: airbnb-urban-accessibility-copenhagen
  study_area: Copenhagen, Denmark
  crs_wgs84: EPSG:4326
  crs_projected: EPSG:25832

inside_airbnb:
  provider: Inside Airbnb
  city_slug: copenhagen
  country_slug: denmark
  region_slug: hovedstaden
  snapshot_date: '2026-06-30'
  landing_page: https://insideairbnb.com/get-the-data/

osm:
  provider: OpenStreetMap via Overpass API
  bbox_margin_degrees: 0.02
  endpoints:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter

copenhagen_statbank:
  provider: City of Copenhagen Statbank
  landing_page: https://kk.statistikbank.dk/statbank5a/SelectTable/Omrade0.asp?PLanguage=1
  district_codes: ['1001', '1002', '1003', '1004', '1005', '1006', '1007', '1008', '1009', '1010']
  tables:
    population: KKBEF1
    households: KKHUS1
    average_disposable_income: KKIND3
    dwelling_context: KKBOL3
  household_period: 2026Q1

municipality_statbank:
  status: frederiksberg_single_analysis_area_source
  provider: Statistics Denmark StatBank
  landing_page: https://www.statbank.dk/statbank5a/SelectTable/Omrade0.asp?PLanguage=1
  api_documentation: https://www.dst.dk/en/Statistik/hjaelp-til-statistikbanken/api
  api_endpoint: https://api.statbank.dk/v1/data
  municipality_codes:
    Copenhagen: '101'
    Frederiksberg: '147'
  tables:
    population: FOLK1A
    households: FAM55N
    average_disposable_income: INDKP106
    dwelling_counts: BOL101
    average_residents_per_dwelling: BOL106
  household_reference_date: '2026-01-01'

privacy:
  raw_data_gitignored: true
  publish_row_level_coordinates: false
  retain_host_names_or_free_text: false
